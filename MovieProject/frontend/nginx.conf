server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/movie-project/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/movie-project/uploads/;
        proxy_set_header Host $host;
}

    location /posters/ {
        proxy_pass http://backend:8080/movie-project/posters/;
        proxy_set_header Host $host;
    }
}